# yaml-language-server: $schema=./schema.json
id: settings
title: { zh-Hant: 影像分析設定, en: Video Analytics Settings }
order: 40

steps:
  - { action: click, testid: nav-tab_settings }
  - { action: waitFor, testid: settings-page }

  # 人臉辨識預設是關的，子設定整塊不在 DOM 裡
  - { action: click, testid: settings-face-enabled }
  - { action: waitFor, testid: settings-face-sub }

  - action: screenshot
    name: settings-01
    clip: { testid: settings-section_analysis, padding: 12 }
    annotate:
      - { key: motion, testid: settings-motion-enabled, legend: { zh-Hant: 動作偵測開關, en: Motion detection switch } }
      - { key: face, testid: settings-face-enabled, legend: { zh-Hant: 人臉辨識開關, en: Face recognition switch } }
      - { key: threshold, testid: settings-face-threshold, legend: { zh-Hant: 相似度門檻, en: Similarity threshold } }

  - { action: click, testid: settings-save }
  - { action: waitFor, testid: toast }
