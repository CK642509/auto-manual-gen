# yaml-language-server: $schema=https://ck642509.github.io/auto-manual-gen/schema/v1/manifest.json
id: layout-preset
title: { zh-Hant: 儲存版面設定, en: Saving a Layout }
order: 30

steps:
  - { action: waitFor, testid: camera-list-skeleton, state: detached }
  - { action: waitFor, testid: camera-list }

  # 先填一格，版面才不是空的
  - { action: dblclick, testid: camera-row_gate-a }

  # grid-cell-fps_{n} 在 3×3 以上會被精簡掉，這張圖只能在 2×2 拍
  - action: screenshot
    name: layout-preset-01
    clip: { testid: grid-view, padding: 12 }
    annotate:
      - { key: cell, testid: grid-cell_1, legend: { zh-Hant: 已配置的格子, en: Assigned cell } }
      - { key: fps, testid: grid-cell-fps_1, legend: { zh-Hant: 即時影格率, en: Live frame rate } }

  - { action: click, testid: grid-layout_4x4 }

  - { action: click, testid: grid-preset-save }
  - { action: waitFor, testid: preset-dialog }
  - { action: fill, testid: preset-dialog-name, text: { zh-Hant: 大廳巡檢, en: Lobby Patrol } }

  - action: screenshot
    name: layout-preset-02
    clip: { testid: preset-dialog, padding: 12 }
    annotate:
      - { key: summary, testid: preset-dialog-summary, legend: { zh-Hant: 目前版面摘要, en: Current layout summary } }
      - { key: name, testid: preset-dialog-name, legend: { zh-Hant: 版面名稱, en: Layout Name } }
      - { key: confirm, testid: preset-dialog-confirm, legend: { zh-Hant: 儲存, en: Save } }

  - { action: click, testid: preset-dialog-confirm }
